name: Prepare SochSathi three story videos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-pooja-stories.yml'
permissions:
  contents: write
jobs:
  split-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check video source
        run: |
          test -s media/sochsathi-pooja-story.mp4
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact media/sochsathi-pooja-story.mp4
      - name: Make three sequential 15-second video stories
        shell: bash
        run: |
          mkdir -p media/stories
          for i in 1 2 3; do
            start=$(( (i-1)*15 ))
            ffmpeg -hide_banner -nostdin -y -loglevel error \
              -ss "$start" -i media/sochsathi-pooja-story.mp4 -t 15 \
              -map 0:v:0 -map 0:a:0 -c:v libx264 -preset veryfast -crf 23 \
              -pix_fmt yuv420p -r 24 -c:a aac -b:a 128k -ar 44100 \
              -movflags +faststart "media/stories/pooja-story-$i.mp4"
            test "$(stat -c%s "media/stories/pooja-story-$i.mp4")" -gt 100000
            ffprobe -v error -show_entries format=duration,size -of csv=p=0 "media/stories/pooja-story-$i.mp4"
          done
      - name: Save the three stories to SochSathi
        shell: bash
        run: |
          git config user.name "SochSathi Video Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/stories/pooja-story-{1,2,3}.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add 3 sequential 15-second SochSathi Hindi story videos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
